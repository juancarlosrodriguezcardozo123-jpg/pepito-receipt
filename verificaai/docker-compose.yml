# PostgreSQL para desarrollo local: docker compose up -d
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: verificaai
      POSTGRES_PASSWORD: verificaai
      POSTGRES_DB: verificaai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
